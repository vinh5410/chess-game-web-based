<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resend Verification Email - Chess Game</title>
    <link rel="stylesheet" href="./styles/auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <i class="fas fa-envelope-circle-check"></i>
                <h1>Resend Verification Email</h1>
                <p>Enter your email to receive a new verification link</p>
            </div>

            <form id="resendForm" class="auth-form">
                <div class="form-group">
                    <label for="email">
                        <i class="fas fa-envelope"></i>
                        Email Address
                    </label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="Enter your email"
                        required 
                        autocomplete="email"
                    >
                </div>

                <button type="submit" class="btn-submit">
                    <i class="fas fa-paper-plane"></i>
                    Send Verification Email
                </button>

                <div id="message" class="message"></div>
            </form>

            <div class="auth-footer">
                <p>Already verified? <a href="/login.html">Login here</a></p>
                <p>Don't have an account? <a href="/register.html">Register here</a></p>
            </div>
        </div>
    </div>

    <script src="./js/utils.js"></script>
    <script>
        // Redirect if already logged in
        if (localStorage.getItem('token')) {
            window.location.href = '/index.html';
        }

        document.getElementById('resendForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const messageEl = document.getElementById('message');
            const submitBtn = e.target.querySelector('.btn-submit');
            
            // Clear previous message
            messageEl.textContent = '';
            messageEl.className = 'message';
            
            // Disable button
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending...';
            
            try {
                const response = await fetch('/api/auth/resend-verification', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email })
                });
                
                const data = await response.json();
                
                if (response.ok && data.success) {
                    messageEl.textContent = data.message;
                    messageEl.className = 'message success';
                    
                    // Clear form
                    document.getElementById('email').value = '';
                } else {
                    messageEl.textContent = data.message || 'Failed to send verification email';
                    messageEl.className = 'message error';
                }
            } catch (error) {
                console.error('Resend verification error:', error);
                messageEl.textContent = 'Network error. Please try again.';
                messageEl.className = 'message error';
            } finally {
                // Re-enable button
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Send Verification Email';
            }
        });
    </script>
</body>
</html>
