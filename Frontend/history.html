<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch sử ván đấu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./styles/navbar.css">
    <link rel="stylesheet" href="./styles/index.css">
    <style>
        .history-item { margin-bottom: 8px; }
        #board { width: 400px; height: 400px; border: 1px solid #333; }
        #replayArea { margin-top: 24px; }
    </style>
</head>
<body>
    <h1>Lịch sử ván đấu</h1>
    <div id="historyList"></div>
    <div id="replayArea" style="display:none;">
    <div style="display:flex; gap:16px; align-items:flex-start; flex-wrap:wrap;">
        <div id="chessboardContainer" class="chessboard-container" style="flex:0 0 auto;">
        <canvas id="chessCanvas" width="640" height="640"></canvas>
        </div>

        <div id="replayControlsRight" style="display:flex; flex-direction:column; gap:12px; align-items:center; min-width:160px;">
        <div style="display:flex; gap:8px; align-items:center;">
            <button id="prevBtn" class="control-btn">⬅️</button>
            <div id="moveInfo" style="min-width:120px; text-align:center;">Bàn cờ ban đầu</div>
            <button id="nextBtn" class="control-btn">➡️</button>
        </div>

        <!-- Optional: thêm các control khác (play/pause, speed) nếu cần -->
        </div>
    </div>
    </div>
    <!-- Nạp chess.js đúng như các file khác -->
    <script src="./libs/chess.js/dist/cjs/chess.js"></script> <!-- UMD/IIFE, không phải CJS/ESM -->
    <script>
        if (typeof Chess !== 'undefined') window.Chess = Chess;
    </script>
    <script src="js/chess-board-renderer.js"></script>
    <script src="js/history.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
        const userStr = localStorage.getItem('user');
        let userId = null;
        if (userStr) {
            try {
                const user = JSON.parse(userStr);
                userId = user._id || user.id; // Thử cả hai trường
            } catch {}
        }
        if (!userId) {
            alert('Bạn chưa đăng nhập!');
            window.location.href = 'login.html';
        } else {
            fetchUserHistory(userId);
        }
            window.renderBoard = function(fen) {
                document.getElementById('board').innerText = fen;
            };
        });
    </script>
</body>
</html>
