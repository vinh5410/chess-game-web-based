<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiplayer - CHESSMATE</title>
    <link rel="shortcut icon" type="image/x-icon" href="./assets/favicon.ico">
    <link rel="stylesheet" href="./styles/play-multiplayer.css">
</head>
<body>
    <div class="app">
        <div class="header">
            <div class="game-info">
                <h1>♟️ Multiplayer Chess</h1>
                <p id="gameStatus">Connecting to server...</p>
                <p id="onlineUsers" class="online-users">👥 Online: 0</p>
            </div>
            
            <button onclick="backToHome()" class="back-home-btn" style="position: absolute; right: 20px; top: 20px; padding: 0.5rem 1rem; background: #667eea; color: white; border: none; border-radius: 8px; cursor: pointer;">
                🏠 Home
            </button>
        </div>

        <!-- Login Screen -->
        <div id="loginScreen" class="menu">
            <h2>Enter Your Name</h2>
            <div class="login-form">
                <input type="text" id="usernameInput" placeholder="Your name" maxlength="20" />
                <button onclick="login()" class="mode-btn">Join Game</button>
            </div>
        </div>

        <!-- Lobby Screen -->
        <div id="lobbyScreen" class="menu hidden">
            <h2>Choose Game Mode</h2>
            <div class="menu-buttons">
                <button onclick="showRandomMatch()" class="mode-btn">
                    🎲 Random Match
                    <span class="btn-desc">Find random opponent</span>
                </button>
                <button onclick="showInviteFriend()" class="mode-btn">
                    👥 Invite Friend
                    <span class="btn-desc">Create private room</span>
                </button>
                <button onclick="showJoinRoom()" class="mode-btn">
                    🔗 Join Room
                    <span class="btn-desc">Enter room code</span>
                </button>
            </div>
            <button onclick="logout()" class="back-btn">Logout</button>
        </div>

        <!-- Random Match Screen -->
        <div id="randomMatchScreen" class="screen hidden">
            <h2>🎲 Random Match</h2>
            <div id="randomMatchTimeSelector"></div>
            <div id="searchStatus">Click button to start searching</div>
            
            <!-- ADD ID HERE -->
            <button id="searchBtn" class="btn btn-primary" onclick="startRandomSearch()">
                🔍 Find Match
            </button>
            <button class="btn btn-danger" onclick="cancelSearch()">Cancel</button>
        </div>
        <!-- Invite Friend Screen -->
        <div id="inviteFriendScreen" class="screen hidden">
            <h2>🔐 Private Room</h2>
            <div id="privateRoomTimeSelector" class="time-selector-wrapper"></div>
            <div id="roomCodeSection" class="room-code-display hidden">
                <h3>Room Code:</h3>
                <input type="text" id="roomCodeDisplay" readonly />
                <button class="copy-btn" onclick="copyRoomCode()">📋 Copy</button>
                <p>Share this code with your friend!</p>
            </div>
            <button class="btn btn-danger" onclick="cancelInvite()">Cancel</button>
        </div>

        <!-- Join Room Screen -->
        <div id="joinRoomScreen" class="menu hidden">
            <h2>🔗 Join Room</h2>
            <div class="join-form">
                <input type="text" id="roomCodeInput" placeholder="Enter room code" maxlength="6" />
                <button onclick="joinRoom()" class="mode-btn">Join</button>
            </div>
            <button onclick="backToLobby()" class="back-btn">← Back</button>
        </div>

        <!-- Online Users List -->
        <div id="onlineUsersList" class="online-list hidden">
            <h3>Online Players</h3>
            <div id="usersContainer" class="users-container"></div>
        </div>

        <!-- Game Screen -->
        <div id="gameScreen" class="game-screen hidden">
            <div class="game-header">
                <div class="player-info opponent-info">
                    <span class="player-avatar">👤</span>
                    <div class="player-details">
                        <span class="player-name" id="opponentName">Opponent</span>
                        <span class="player-color" id="opponentColor">⚫</span>
                    </div>
                    <div class="player-timer" id="opponentTimer">5:00</div>
                </div>
            </div>

            <div class="chessboard-container">
                <canvas id="chessCanvas" width="640" height="640"></canvas>
                <div id="gameOverOverlay" class="game-over hidden">
                    <p>Game Over</p>
                    <p id="winnerText">Winner: White</p>
                    <button onclick="backToLobby()" class="restart-btn">Back to Lobby</button>
                </div>
            </div>

            <div class="game-footer">
                <div class="player-info current-player-info">
                    <div class="player-timer" id="playerTimer">5:00</div>
                    <div class="player-details">
                        <span class="player-name" id="playerName">You</span>
                        <span class="player-color" id="playerColor">⚪</span>
                    </div>
                    <span class="player-avatar">👤</span>
                </div>
            </div>

            <div class="game-controls">
                <button onclick="offerDraw()" class="control-btn" id="drawBtn">🤝 Offer Draw</button>
                <button onclick="resign()" class="control-btn resign-btn">🏳️ Resign</button>
                <button onclick="flipBoard()" class="control-btn">🔄 Flip</button>
            </div>

            <!-- Chat Box -->
            <div class="chat-box">
                <div class="chat-messages" id="chatMessages"></div>
                <div class="chat-input-container">
                    <input type="text" id="chatInput" placeholder="Type a message..." maxlength="200" />
                    <button onclick="sendMessage()">Send</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ==================== SCRIPTS - LOAD IN CORRECT ORDER ==================== -->
    
    <!-- 0. DEBUG SCRIPT - ADD THIS FIRST -->
    <script>
        console.log('🔧 ========================================');
        console.log('🔧 DEBUG: Page loading started');
        console.log('🔧 ========================================');
        
        // Test function to verify onclick works
        window.testButtonClick = function() {
            console.log('✅ TEST: Button onclick is working!');
            alert('Button click works!');
        };
        
        // Override console.error to catch all errors
        const originalError = console.error;
        console.error = function(...args) {
            originalError.apply(console, ['🚨 ERROR:', ...args]);
            originalError.apply(console, args);
        };
        
        // Catch all unhandled errors
        window.addEventListener('error', (e) => {
            console.error('🚨 Unhandled error:', e.message, e.filename, e.lineno, e.colno);
        });
        
        // Catch all promise rejections
        window.addEventListener('unhandledrejection', (e) => {
            console.error('🚨 Unhandled promise rejection:', e.reason);
        });
        
        console.log('🔧 Debug script loaded');
    </script>
    
    <!-- 1. External libraries -->
    <script src="./libs/chess.js/dist/cjs/chess.js"></script>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    
    <!-- 2. Auth check -->
    <script src="./js/auth-check.js"></script>
    
    <!-- 3. Initialize libraries -->
    <script>
        console.log('🔧 Initializing libraries...');
        
        // Check auth
        if (typeof requireAuth === 'function' && !requireAuth()) {
            // Will redirect if not authenticated
        }
        
        // Initialize Chess.js
        if (typeof Chess !== 'undefined') {
            window.Chess = Chess;
            console.log('✅ Chess.js loaded');
        } else {
            console.error('❌ Chess.js not loaded');
        }
        
        // Initialize Socket.IO
        if (typeof io !== 'undefined') {
            console.log('✅ Socket.IO loaded');
        } else {
            console.error('❌ Socket.IO not loaded');
        }
        
        // Back to home function
        function backToHome() {
            if (confirm('Are you sure you want to leave the game?')) {
                window.location.href = '/index.html';
            }
        }
        
        console.log('🔧 Libraries initialized');
    </script>
    
    <!-- 4. UTILITY CLASSES -->
    <script>
        console.log('🔧 Loading utils.js...');
    </script>
    <script src="./js/utils.js"></script>
    <script>
        console.log('🔧 Utils.js loaded, checking GameUtils:', typeof GameUtils);
    </script>
    
    <script>
        console.log('🔧 Loading ui-manager.js...');
    </script>
    <script src="./js/ui-manager.js"></script>
    <script>
        console.log('🔧 UI-manager.js loaded, checking uiManager:', typeof window.uiManager);
    </script>
    
    <script>
        console.log('🔧 Loading event-manager.js...');
    </script>
    <script src="./js/event-manager.js"></script>
    <script>
        console.log('🔧 Event-manager.js loaded, checking eventManager:', typeof window.eventManager);
    </script>
    
    <!-- 5. Socket client -->
    <script>
        console.log('🔧 Loading socket-client.js...');
    </script>
    <script src="./js/socket-client.js"></script>
    <script>
        console.log('🔧 Socket-client.js loaded, checking socketClient:', typeof window.socketClient);
    </script>
    
    <!-- 6. Time control utilities -->
    <script>
        console.log('🔧 Loading time-controls-config.js...');
    </script>
    <script src="./js/time-controls-config.js"></script>
    <script>
        console.log('🔧 Time-controls-config.js loaded, checking TIME_CONTROLS:', typeof TIME_CONTROLS);
    </script>
    
    <script>
        console.log('🔧 Loading time-selector.js...');
    </script>
    <script src="./js/time-selector.js"></script>
    <script>
        console.log('🔧 Time-selector.js loaded, checking renderTimeSelector:', typeof renderTimeSelector);
    </script>
    
    <!-- 7. Base chess board renderer -->
    <script>
        console.log('🔧 Loading chess-board-renderer.js...');
    </script>
    <script src="./js/chess-board-renderer.js"></script>
    <script>
        console.log('🔧 Chess-board-renderer.js loaded, checking ChessBoardRenderer:', typeof ChessBoardRenderer);
    </script>
    
    <!-- 8. Game-specific class -->
    <script>
        console.log('🔧 Loading play-multiplayer.js...');
    </script>
    <script src="./js/play-multiplayer.js"></script>
    <script>
        console.log('🔧 Play-multiplayer.js loaded');
        console.log('🔧 Checking functions:');
        console.log('   - MultiplayerChess:', typeof MultiplayerChess);
        console.log('   - startRandomSearch:', typeof startRandomSearch);
        console.log('   - cancelSearch:', typeof cancelSearch);
        console.log('   - showRandomMatch:', typeof showRandomMatch);
        console.log('🔧 ========================================');
        console.log('🔧 All scripts loaded');
        console.log('🔧 ========================================');
    </script>
    
    <!-- TEST BUTTON INLINE -->
    <script>
        // Make functions globally accessible for debugging
        if (typeof startRandomSearch !== 'undefined') {
            window.startRandomSearch = startRandomSearch;
            console.log('✅ startRandomSearch exposed to window');
        } else {
            console.error('❌ startRandomSearch not found!');
        }
        
        if (typeof cancelSearch !== 'undefined') {
            window.cancelSearch = cancelSearch;
            console.log('✅ cancelSearch exposed to window');
        } else {
            console.error('❌ cancelSearch not found!');
        }
    </script>
</body>
</html>
