<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CHESSMATE</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="./styles/login.css">
    <link rel="shortcut icon" type="image/x-icon" href="./assets/favicon.ico">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script async defer crossorigin="anonymous" src="https://connect.facebook.net/en_US/sdk.js"></script>
</head>
<body>
    
    <div class="bg-gradient"></div>
    <div class="bg-blur"></div>

    <main class="split-container">
        
        <section class="brand-panel">
            <a href="index.html" class="brand-content">
                <div class="huge-logo">
                    <i class="fa-solid fa-chess-king"></i>
                </div>
                <h1>CHESSMATE</h1>
                <p class="tagline">Master the Game. Anytime. Anywhere.</p>
            </a>
            <div class="brand-background-graphic">
                <i class="fa-solid fa-chess-knight"></i>
            </div>
        </section>

        <section class="form-panel">
            <div class="auth-card">

                <div class="auth-header">
                    <div class="mobile-logo" onclick="window.location.href='index.html'">
                         <i class="fa-solid fa-chess-king"></i> CHESSMATE
                    </div>
                    <h2> Welcome </h2>
                    <p>Sign in to continue your conquest</p>
                </div>
                
                <form id="loginForm">
                    <div class="form-group">
                        <label for="email"><i class="fa-solid fa-envelope"></i> Email</label>
                        <input type="email" id="email" name="email" required 
                               placeholder="grandmaster@example.com" autocomplete="off">
                    </div>
                    
                    <div class="form-group">
                        <label for="password"><i class="fa-solid fa-lock"></i> Password</label>
                        <input type="password" id="password" name="password" required 
                               placeholder="••••••••">
                    </div>
                    
                    <button type="submit" class="btn-submit">
                        Login <i class="fa-solid fa-arrow-right-to-bracket"></i>
                    </button>
                </form>
                
                <div id="message" class="message"></div>
                
                <div class="auth-links">
                    <a href="register.html">Create Account</a>
                    <span class="divider">•</span>
                    <a href="forgot-password.html">Forgot Password?</a>
                </div>

                <div class="divider" style="margin: 20px 0; position: relative; text-align: center;">
                    <hr style="border: 0; border-top: 1px solid #334155; position: absolute; top: 50%; width: 100%; z-index: 0;">
                    <span style="background: #1e293b; padding: 0 10px; color: #94a3b8; position: relative; z-index: 1; font-size: 0.9rem;">OR</span>
                </div>

                <div class="social-login" style="display: flex; flex-direction: column; gap: 12px; align-items: center;">
                    <div id="g_id_onload"
                         data-client_id="502191640572-mkcgl076l0bkbn27j90t3hmbnsb8gmj0.apps.googleusercontent.com"
                         data-callback="handleCredentialResponse"
                         data-auto_prompt="false">
                    </div>
                    <div class="g_id_signin"
                         data-type="standard"
                         data-size="large"
                         data-theme="outline"
                         data-text="sign_in_with"
                         data-shape="rectangular"
                         data-logo_alignment="left"
                         data-width="350">
                    </div>
                    
                    <button type="button" class="social-btn facebook-btn" onclick="fbLogin()" style="background: #1877f2; color: white; border: none; padding: 12px; border-radius: 4px; cursor: pointer; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 10px; font-family: inherit; font-size: 14px; transition: background 0.2s; width: 100%;">
                        <i class="fa-brands fa-facebook-f" style="font-size: 16px;"></i> Continue with Facebook
                    </button>
                </div>
            </div>
        </section>
    </main>
    
    <script src="/js/app-config.js"></script>
    <script src="./js/auth-check.js"></script>
    <script src="./js/navbar.js"></script>
    <script src="./js/social-auth.js"></script>
    <script src="./js/login.js"></script>
</body>
</html>
