<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Password - CHESSMATE</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="./styles/login.css">
    <link rel="shortcut icon" type="image/x-icon" href="./assets/favicon.ico">
</head>
<body>
    
    <div class="bg-gradient"></div>
    <div class="bg-blur"></div>

    <main class="split-container">
        
        <section class="brand-panel">
            <a href="index.html" class="brand-content">
                <div class="huge-logo">
                    <i class="fa-solid fa-chess-king"></i>
                </div>
                <h1>CHESSMATE</h1>
                <p class="tagline">Master the Game. Anytime. Anywhere.</p>
            </a>
        </section>

        <section class="form-panel">
            <div class="auth-card">
                <div class="auth-header">
                    <div class="mobile-logo">
                        <i class="fa-solid fa-chess-king"></i>
                    </div>
                    <h2>Set New Password</h2>
                    <p>Create a secure password for your account</p>
                </div>
                
                <form id="resetForm">
                    <div class="form-group">
                        <label for="password">New Password</label>
                        <input type="password" id="password" required 
                               placeholder="Min 6 characters">
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword">Confirm Password</label>
                        <input type="password" id="confirmPassword" required 
                               placeholder="Re-enter new password">
                    </div>
                    
                    <button type="submit" class="btn-submit">
                        <i class="fa-solid fa-key"></i> Update Password
                    </button>
                </form>
                
                <div id="message" class="message"></div>
            </div>
        </section>
    </main>

    <script>
        // 1. Lấy Token từ URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        // Nếu không có token thì báo lỗi ngay
        if (!token) {
            document.querySelector('.auth-card').innerHTML = 
                "<h2 style='color:#ef4444; text-align:center'>Invalid or Expired Link</h2><p style='text-align:center'><a href='login.html'>Back to Login</a></p>";
        }

        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirmPassword').value;
            const msgDiv = document.getElementById('message');
            const btn = document.querySelector('.btn-submit');

            if (password !== confirm) {
                msgDiv.style.color = 'red';
                msgDiv.innerText = "Passwords do not match!";
                return;
            }

            if (password.length < 6) {
                msgDiv.style.color = 'red';
                msgDiv.innerText = "Password must be at least 6 chars.";
                return;
            }

            btn.innerText = "Updating...";
            btn.disabled = true;

            try {
                // 2. Gọi API kèm Token
                const res = await fetch(`http://localhost:3000/api/auth/resetpassword/${token}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });

                const data = await res.json();

                if (data.success) {
                    msgDiv.style.color = 'green';
                    msgDiv.innerHTML = "✅ Password updated!<br>Redirecting to login...";
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2000);
                } else {
                    msgDiv.style.color = 'red';
                    msgDiv.innerText = "❌ " + data.message;
                    btn.disabled = false;
                    btn.innerText = "Update Password";
                }
            } catch (err) {
                msgDiv.style.color = 'red';
                msgDiv.innerText = "Server error.";
                btn.disabled = false;
                btn.innerText = "Update Password";
            }
        });
    </script>
</body>
</html>
