<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Password - CHESSMATE</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="./styles/login.css">
    <link rel="shortcut icon" type="image/x-icon" href="./assets/favicon.ico">
</head>
<body>
    
    <div class="bg-gradient"></div>
    <div class="bg-blur"></div>

    <main class="split-container">
        
        <section class="brand-panel">
            <div class="brand-content">
                <div class="huge-logo">
                    <i class="fa-solid fa-chess-king"></i>
                </div>
                <h1>CHESSMATE</h1>
                <p class="tagline">Secure your Kingdom.</p>
            </div>
            <div class="brand-background-graphic">
                <i class="fa-solid fa-chess-queen"></i>
            </div>
        </section>

        <section class="form-panel">
            <div class="auth-card">
                
                <div class="auth-header">
                    <div class="mobile-logo" onclick="window.location.href='index.html'">
                         <i class="fa-solid fa-chess-king"></i> CHESSMATE
                    </div>
                    <h2>Set New Password</h2>
                    <p>Create a strong password to protect your account</p>
                </div>
                
                <form id="resetForm">
                    <div class="form-group">
                        <label for="password"><i class="fa-solid fa-key"></i> New Password</label>
                        <input type="password" id="password" required 
                               placeholder="Min 6 characters">
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword"><i class="fa-solid fa-shield-halved"></i> Confirm Password</label>
                        <input type="password" id="confirmPassword" required 
                               placeholder="Re-enter new password">
                    </div>
                    
                    <button type="submit" class="btn-submit">
                        Update Password <i class="fa-solid fa-check-double"></i>
                    </button>
                </form>
                
                <div id="message" class="message"></div>
                
                <div class="auth-links">
                    <a href="login.html">Back to Login</a>
                </div>
            </div>
        </section>
    </main>

    <script>
        // 1. Lấy Token từ URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        // Nếu không có token thì báo lỗi ngay
        if (!token) {
            // Thay vì ghi đè auth-container cũ, ta ghi vào auth-card để giữ style đẹp
            document.querySelector('.auth-card').innerHTML = `
                <div style="text-align:center; padding: 2rem 0;">
                    <i class="fa-solid fa-triangle-exclamation" style="font-size: 3rem; color: #f87171; margin-bottom: 1rem;"></i>
                    <h2 style="color:#f87171; margin-bottom: 0.5rem; font-family: var(--font-heading);">Invalid Link</h2>
                    <p style="color: var(--text-muted); margin-bottom: 1.5rem;">This password reset link is invalid or has expired.</p>
                    <a href='login.html' class="btn-submit" style="text-decoration:none; display:inline-block;">Back to Login</a>
                </div>
            `;
        }

        document.getElementById('resetForm')?.addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirmPassword').value;
            const msgDiv = document.getElementById('message');
            const btn = document.querySelector('.btn-submit');

            // Reset style
            msgDiv.style.color = '';
            
            if (password !== confirm) {
                msgDiv.style.color = '#f87171'; // Màu đỏ sáng
                msgDiv.innerHTML = '<i class="fa-solid fa-xmark"></i> Passwords do not match!';
                return;
            }

            if (password.length < 6) {
                msgDiv.style.color = '#f87171';
                msgDiv.innerHTML = '<i class="fa-solid fa-circle-info"></i> Password must be at least 6 chars.';
                return;
            }

            // Loading State
            btn.innerHTML = 'Updating... <i class="fa-solid fa-spinner fa-spin"></i>';
            btn.disabled = true;

            try {
                // 2. Gọi API kèm Token
                const res = await fetch(`http://localhost:3000/api/auth/resetpassword/${token}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });

                const data = await res.json();

                if (data.success) {
                    msgDiv.style.color = '#4ade80'; // Màu xanh sáng
                    msgDiv.innerHTML = "✅ Password updated!<br>Redirecting to login...";
                    btn.innerHTML = 'Success <i class="fa-solid fa-check"></i>';
                    
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2000);
                } else {
                    msgDiv.style.color = '#f87171';
                    msgDiv.innerText = "❌ " + data.message;
                    btn.disabled = false;
                    btn.innerHTML = 'Update Password <i class="fa-solid fa-check-double"></i>';
                }
            } catch (err) {
                msgDiv.style.color = '#f87171';
                msgDiv.innerText = "Server error.";
                btn.disabled = false;
                btn.innerHTML = 'Update Password <i class="fa-solid fa-check-double"></i>';
            }
        });
    </script>
</body>
</html>
