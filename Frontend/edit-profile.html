<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile - CHESSMATE</title>
    <link rel="stylesheet" href="./styles/navbar.css">
    <link rel="stylesheet" href="./styles/auth.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="navbar-container">
            <a href="/" class="navbar-brand">
                <span>♔</span> CHESSMATE
            </a>
            
            <ul class="navbar-menu">
                <li><a href="/">Home</a></li>
                <li><a href="/play-vs-bot.html">Play vs Bot</a></li>
                <li><a href="/play-multiplayer.html">Multiplayer</a></li>
                <li><a href="/leaderboard.html">Leaderboard</a></li>
            </ul>
            
            <div class="navbar-actions">
                <div id="user-menu">
                    <div class="dropdown">
                        <div class="user-info">
                            <img id="user-avatar" src="https://ui-avatars.com/api/?name=User" alt="Avatar" class="user-avatar">
                            <span id="username-display" class="username">User</span>
                        </div>
                        <div class="dropdown-menu">
                            <a href="/profile.html" class="dropdown-item">👤 My Profile</a>
                            <a href="/edit-profile.html" class="dropdown-item">⚙️ Edit Profile</a>
                            <div class="dropdown-divider"></div>
                            <a href="#" id="logout-btn" class="dropdown-item">🚪 Logout</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Edit Profile Form -->
    <div class="auth-container">
        <h2>Edit Profile</h2>
        
        <form id="editProfileForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>
            </div>
            
            <div class="form-group">
                <label for="avatar">Avatar URL</label>
                <input type="url" id="avatar" name="avatar" placeholder="https://...">
            </div>
            
            <button type="submit" class="btn-submit">Save Changes</button>
        </form>
        
        <div id="message" class="message"></div>
        
        <hr style="margin: 2rem 0;">
        
        <h3>Change Password</h3>
        <form id="changePasswordForm">
            <div class="form-group">
                <label for="currentPassword">Current Password</label>
                <input type="password" id="currentPassword" required>
            </div>
            
            <div class="form-group">
                <label for="newPassword">New Password</label>
                <input type="password" id="newPassword" required minlength="6">
            </div>
            
            <div class="form-group">
                <label for="confirmNewPassword">Confirm New Password</label>
                <input type="password" id="confirmNewPassword" required minlength="6">
            </div>
            
            <button type="submit" class="btn-submit">Change Password</button>
        </form>
        
        <div id="passwordMessage" class="message"></div>
    </div>

    <script src="./js/auth-check.js"></script>
    <script src="./js/edit-profile.js"></script>
</body>
</html>
