<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile - CHESSMATE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="./styles/basic.css">
    <link rel="stylesheet" href="./styles/index.css">
    <link rel="stylesheet" href="./styles/navbar.css">
    <style>
        :root {
            --primary: #d4af37;
            --primary-hover: #f1c40f;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --glass-bg: rgba(30, 41, 59, 0.75);
        }
        
        html, body {
            height: auto !important;
            min-height: 100vh;
            overflow-y: auto !important;
            overflow-x: hidden;
            background-color: #0f172a;
            background-image: radial-gradient(circle at 10% 20%, rgba(30, 58, 138, 0.4), transparent 50%),
                              radial-gradient(circle at 90% 80%, rgba(51, 29, 44, 0.5), transparent 50%);
        }
        
        .profile-container {
            max-width: 500px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        
        .profile-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        
        .profile-card h2 {
            color: var(--primary);
            margin-bottom: 1.25rem;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .form-group {
            margin-bottom: 1rem;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 0.4rem;
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 500;
        }
        
        .form-group label i {
            width: 20px;
            color: var(--primary);
            text-align: center;
        }
        
        .form-group input {
            width: 100%;
            padding: 10px 14px;
            border-radius: 8px;
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            transition: 0.3s;
            outline: none;
        }
        
        .form-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.15);
            background: rgba(15, 23, 42, 0.8);
        }
        
        .avatar-input-group {
            display: flex;
            gap: 0.5rem;
        }
        
        .avatar-input-group input {
            flex: 1;
        }
        
        .upload-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 42px;
            height: 42px;
            background: rgba(212, 175, 55, 0.2);
            border: 1px solid var(--primary);
            border-radius: 8px;
            color: var(--primary);
            cursor: pointer;
            transition: 0.3s;
            flex-shrink: 0;
        }
        
        .upload-btn:hover {
            background: var(--primary);
            color: #0f172a;
        }
        
        .input-hint {
            display: block;
            margin-top: 0.4rem;
            font-size: 0.75rem;
            color: var(--text-muted);
        }
        
        /* Avatar Section */
        .avatar-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 1rem 0;
        }
        
        .avatar-upload-area {
            position: relative;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            overflow: hidden;
            cursor: pointer;
            margin-bottom: 1rem;
        }
        
        .avatar-upload-area img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border: 4px solid var(--primary);
            border-radius: 50%;
            transition: 0.3s;
        }
        
        .avatar-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: 0.3s;
            border-radius: 50%;
        }
        
        .avatar-upload-area:hover .avatar-overlay {
            opacity: 1;
        }
        
        .avatar-overlay-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.25rem;
            color: white;
            cursor: pointer;
            font-size: 0.8rem;
        }
        
        .avatar-overlay-btn i {
            font-size: 1.5rem;
        }
        
        .avatar-info {
            margin-bottom: 1rem;
        }
        
        .avatar-info .name {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 0.25rem;
        }
        
        .avatar-info .email {
            font-size: 0.9rem;
            color: var(--text-muted);
        }
        
        .avatar-actions {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .btn-avatar-action {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.3s;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-main);
        }
        
        .btn-avatar-action:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-1px);
        }
        
        .btn-avatar-action.btn-remove {
            color: #ef4444;
            border-color: rgba(239, 68, 68, 0.3);
        }
        
        .btn-avatar-action.btn-remove:hover {
            background: rgba(239, 68, 68, 0.2);
        }
        
        .btn-submit {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            background: linear-gradient(135deg, var(--primary), #b8860b);
            color: #0f172a;
            font-weight: 700;
            font-size: 0.95rem;
            border: none;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 0.75rem;
        }
        
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(212, 175, 55, 0.4);
        }
        
        .btn-secondary {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            font-weight: 600;
            font-size: 0.95rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 0.75rem;
        }
        
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }
        
        .message {
            margin-top: 1rem;
            padding: 0.75rem;
            border-radius: 8px;
            text-align: center;
            font-size: 0.9rem;
            min-height: 20px;
        }
        
        .message.success {
            background: rgba(34, 197, 94, 0.2);
            color: #22c55e;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }
        
        .message.error {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }
        
        .section-divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
            margin: 1.5rem 0;
        }
    </style>
</head>
<body>
    <div class="bg-gradient"></div>
    <div class="bg-blur"></div>

    <!-- Navbar Component -->
    <div id="navbar-placeholder"></div>

    <div class="profile-container">
        <div class="profile-card">
            
            <!-- Avatar Section -->
            <div class="avatar-section">
                <div class="avatar-upload-area">
                    <img id="avatar-preview-img" src="https://ui-avatars.com/api/?name=User" alt="Avatar">
                    <div class="avatar-overlay">
                        <label for="avatarFile" class="avatar-overlay-btn">
                            <i class="fa-solid fa-camera"></i>
                            <span>Change</span>
                        </label>
                    </div>
                    <input type="file" id="avatarFile" accept="image/*" hidden>
                </div>
                <div class="avatar-info">
                    <div class="name" id="preview-username">Username</div>
                    <div class="email" id="preview-email">email@example.com</div>
                </div>
                <div class="avatar-actions">
                    <label for="avatarFile" class="btn-avatar-action">
                        <i class="fa-solid fa-upload"></i> Upload Photo
                    </label>
                    <button type="button" id="removeAvatarBtn" class="btn-avatar-action btn-remove">
                        <i class="fa-solid fa-trash"></i> Remove
                    </button>
                </div>
            </div>
            
            <div class="section-divider"></div>
            
            <h2><i class="fa-solid fa-user-pen"></i> Profile Settings</h2>
            
            <form id="editProfileForm">
                <div class="form-group">
                    <label for="username"><i class="fa-solid fa-user"></i> Username</label>
                    <input type="text" id="username" name="username" required placeholder="Enter username">
                </div>
                
                <div class="form-group">
                    <label for="avatarUrl"><i class="fa-solid fa-link"></i> Avatar URL (optional)</label>
                    <input type="text" id="avatarUrl" name="avatarUrl" placeholder="https://example.com/avatar.jpg">
                    <small class="input-hint">Or paste a direct link to an image</small>
                </div>
                
                <!-- Hidden input to store actual avatar value -->
                <input type="hidden" id="avatar" name="avatar">
                
                <button type="submit" class="btn-submit">
                    <i class="fa-solid fa-save"></i> Save Changes
                </button>
            </form>
            
            <div id="message" class="message"></div>
            
            <div class="section-divider"></div>
            
            <h2><i class="fa-solid fa-lock"></i> Change Password</h2>
            <form id="changePasswordForm">
                <div class="form-group">
                    <label for="currentPassword"><i class="fa-solid fa-key"></i> Current Password</label>
                    <input type="password" id="currentPassword" required placeholder="••••••••">
                </div>
                
                <div class="form-group">
                    <label for="newPassword"><i class="fa-solid fa-lock"></i> New Password</label>
                    <input type="password" id="newPassword" required minlength="6" placeholder="At least 6 characters">
                </div>
                
                <div class="form-group">
                    <label for="confirmNewPassword"><i class="fa-solid fa-shield-halved"></i> Confirm Password</label>
                    <input type="password" id="confirmNewPassword" required minlength="6" placeholder="Re-enter new password">
                </div>
                
                <button type="submit" class="btn-secondary">
                    <i class="fa-solid fa-key"></i> Change Password
                </button>
            </form>
            
            <div id="passwordMessage" class="message"></div>
        </div>
    </div>

    <script src="./js/components/loader.js"></script>
    <script src="./js/auth-check.js"></script>
    <script src="./js/navbar.js"></script>
    <script src="./js/edit-profile.js"></script>
</body>
</html>
