<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - CHESSMATE</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="./styles/login.css">
    <link rel="shortcut icon" type="image/x-icon" href="./assets/favicon.ico">
</head>
<body>
    
    <div class="bg-gradient"></div>
    <div class="bg-blur"></div>

    <main class="split-container">
        
        <section class="brand-panel">
            <div class="brand-content">
                <div class="huge-logo">
                    <i class="fa-solid fa-chess-king"></i>
                </div>
                <h1>CHESSMATE</h1>
                <p class="tagline">Recover your Strategy.</p>
            </div>
            <div class="brand-background-graphic">
                <i class="fa-solid fa-chess-rook"></i>
            </div>
        </section>

        <section class="form-panel">
            <div class="auth-card">
                
                <a href="login.html" class="btn-back">
                    <i class="fa-solid fa-arrow-left-long"></i> Back to Login
                </a>

                <div class="auth-header">
                    <div class="mobile-logo" onclick="window.location.href='index.html'">
                         <i class="fa-solid fa-chess-king"></i> CHESSMATE
                    </div>
                    <h2>Reset Password</h2>
                    <p>Enter your email to receive a reset link</p>
                </div>
                
                <form id="forgotForm">
                    <div class="form-group">
                        <label for="email"><i class="fa-solid fa-envelope"></i> Email Address</label>
                        <input type="email" id="email" name="email" required 
                               placeholder="Enter your registered email" autocomplete="off">
                    </div>
                    
                    <button type="submit" class="btn-submit">
                        Send Reset Link <i class="fa-regular fa-paper-plane"></i>
                    </button>
                </form>
                
                <div id="message" class="message"></div>
                
                <div class="auth-links">
                    <a href="reset-password.html">Reset password</a> 
                    <span class="divider">•</span>
                    <a href="login.html">Login here</a>
                </div>
            </div>
        </section>
    </main>

    <script>
        document.getElementById('forgotForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const msgDiv = document.getElementById('message');
            const btn = document.querySelector('.btn-submit');
            
            // UI Loading state
            msgDiv.innerText = "";
            // Lưu lại nội dung gốc của nút để restore sau này nếu muốn
            const originalBtnContent = btn.innerHTML; 
            btn.innerHTML = 'Sending... <i class="fa-solid fa-spinner fa-spin"></i>';
            btn.disabled = true;

            try {
                // Gọi API Backend
                const res = await fetch('http://localhost:3000/api/auth/forgotpassword', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });

                const data = await res.json();
                
                // Style thông báo dựa trên biến CSS trong auth.css (nếu muốn) 
                // hoặc giữ nguyên style inline như bạn yêu cầu
                if (data.success) {
                    msgDiv.style.color = '#4ade80'; // Màu xanh lá sáng (Tailwind green-400) cho nền tối
                    msgDiv.innerHTML = '<i class="fa-solid fa-check-circle"></i> Email sent! Check your inbox.';
                    btn.innerHTML = 'Sent <i class="fa-solid fa-check"></i>';
                } else {
                    msgDiv.style.color = '#f87171'; // Màu đỏ sáng (Tailwind red-400)
                    msgDiv.innerHTML = '<i class="fa-solid fa-circle-exclamation"></i> ' + data.message;
                    
                    // Reset button state
                    btn.disabled = false;
                    btn.innerHTML = 'Send Reset Link <i class="fa-regular fa-paper-plane"></i>';
                }
            } catch (err) {
                msgDiv.style.color = '#f87171';
                msgDiv.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> Server connection error.';
                
                // Reset button state
                btn.disabled = false;
                btn.innerHTML = 'Send Reset Link <i class="fa-regular fa-paper-plane"></i>';
            }
        });
    </script>
</body>
</html>
