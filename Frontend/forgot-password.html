<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - CHESSMATE</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="./styles/login.css">
    <link rel="shortcut icon" type="image/x-icon" href="./assets/favicon.ico">
</head>
<body>
    
    <div class="bg-gradient"></div>
    <div class="bg-blur"></div>

    <main class="split-container">
        
        <section class="brand-panel">
            <a href="index.html" class="brand-content">
                <div class="huge-logo">
                    <i class="fa-solid fa-chess-king"></i>
                </div>
                <h1>CHESSMATE</h1>
                <p class="tagline">Master the Game. Anytime. Anywhere.</p>
            </a>
        </section>

        <section class="form-panel">
            <div class="auth-card">
                <div class="auth-header">
                    <div class="mobile-logo">
                        <i class="fa-solid fa-chess-king"></i>
                    </div>
                    <h2>Forgot Password</h2>
                    <p>Enter your email to receive a reset link</p>
                </div>
                
                <form id="forgotForm">
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" required 
                               placeholder="Enter your registered email">
                    </div>
                    
                    <button type="submit" class="btn-submit">
                        <i class="fa-solid fa-paper-plane"></i> Send Reset Link
                    </button>
                </form>
                
                <div id="message" class="message"></div>
                
                <div class="auth-links">
                    Remember password? <a href="login.html">Login here</a>
                </div>
            </div>
        </section>
    </main>

    <script>
        document.getElementById('forgotForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const msgDiv = document.getElementById('message');
            const btn = document.querySelector('.btn-submit');
            
            // UI Loading
            msgDiv.innerText = "";
            btn.innerText = "Sending...";
            btn.disabled = true;

            try {
                // Gọi API Backend
                const res = await fetch('http://localhost:3000/api/auth/forgotpassword', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });

                const data = await res.json();
                
                if (data.success) {
                    msgDiv.style.color = 'green';
                    msgDiv.innerHTML = "✅ Email sent! Check your inbox.";
                } else {
                    msgDiv.style.color = 'red';
                    msgDiv.innerText = "❌ " + data.message;
                    btn.disabled = false;
                    btn.innerText = "Send Reset Link";
                }
            } catch (err) {
                msgDiv.style.color = 'red';
                msgDiv.innerText = "Server connection error.";
                btn.disabled = false;
                btn.innerText = "Send Reset Link";
            }
        });
    </script>
</body>
</html>
