<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Puzzles - CHESSMATE</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="./styles/navbar.css">
    <link rel="stylesheet" href="./styles/puzzles.css"> 
    <link rel="shortcut icon" type="image/x-icon" href="./assets/favicon.ico">
</head>
<body>
    
    <div class="bg-gradient"></div>
    <div class="bg-blur"></div>

    <nav class="navbar">
        <div class="navbar-container">
            <a href="/" class="navbar-brand">
                <i class="fa-solid fa-chess-king"></i> CHESSMATE
            </a>
            
            <ul class="navbar-menu">
                <li><a href="/play-multiplayer.html"><i class="fa-solid fa-users"></i> Multiplayer</a></li>
                <li><a href="/play-vs-bot.html"><i class="fa-solid fa-robot"></i> VS Bot</a></li>
                <li><a href="/puzzles.html"><i class="fa-solid fa-puzzle-piece"></i> Puzzles</a></li>
                <li><a href="/leaderboard.html"><i class="fa-solid fa-trophy"></i> Leaderboard</a></li>
            </ul>
            
            <div class="navbar-actions">
                <div id="auth-buttons">
                    <a href="/login.html" class="btn btn-secondary">Log In</a>
                    <a href="/register.html" class="btn btn-primary">Sign Up</a>
                </div>
                
                <div id="user-menu">
                    <div class="dropdown">
                        <div class="user-info">
                            <img id="user-avatar" src="https://ui-avatars.com/api/?name=User" alt="Avatar" class="user-avatar">
                            <span id="username-display" class="username">User</span>
                            <i class="fa-solid fa-chevron-down"></i>
                        </div>
                        <div class="dropdown-menu">
                            <a href="/profile.html" class="dropdown-item"><i class="fa-regular fa-user"></i> My Profile</a>
                            <a href="/history.html" class="dropdown-item"><i class="fa-solid fa-history"></i> History</a>
                            <a href="/edit-profile.html" class="dropdown-item"><i class="fa-solid fa-gear"></i> Settings</a>
                            <div class="dropdown-divider"></div>
                            <a href="#" id="logout-btn" class="dropdown-item text-danger"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <div class="puzzles-page-wrapper">
        <div class="puzzle-layout">
            
            <div class="board-column">
                <div class="board-header">
                    <div class="player-info">
                        <img src="https://ui-avatars.com/api/?name=Bot&background=random" class="mini-avatar">
                        <span>Puzzle Bot</span>
                    </div>
                    <div class="player-info">
                        <span id="puzzle-difficulty" style="opacity: 0.8; font-size: 0.85rem">Intermediate</span>
                    </div>
                </div>

                <div class="canvas-wrapper">
                    <canvas id="puzzleCanvas" width="640" height="640"></canvas>
                    
                    <div id="feedback" class="feedback-overlay hidden">
                        <div class="feedback-content">
                            <div class="feedback-icon" id="feedback-icon">✅</div>
                            <h3 id="feedback-message">Correct!</h3>
                            <div id="rating-change" class="rating-change">+10</div>
                            <button id="btn-next-action" class="btn-next">
                                Next Puzzle <i class="fa-solid fa-arrow-right"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <div class="board-footer">
                     <div class="player-info">
                        <img src="https://ui-avatars.com/api/?name=You&background=0D8ABC&color=fff" class="mini-avatar">
                        <span class="username">You</span>
                    </div>
                    <div class="player-info">
                        <span id="to-move" style="background: rgba(255,255,255,0.1); padding: 2px 8px; border-radius: 10px;">
                            White to move
                        </span>
                    </div>
                </div>
            </div>

            <div class="info-column">
                <div class="dashboard-card">
                    
                    <div class="dash-header">
                        <div>
                            <h2 id="puzzle-title">Tactical Sequence</h2>
                            <span id="puzzle-themes" class="theme-badge">Fork, Pin</span>
                        </div>
                        <div class="timer-box" id="timer">0:00</div>
                    </div>

                    <div class="dash-stats">
                        <div class="mini-stat">
                            <span class="label">Rating</span>
                            <span class="val" id="puzzle-rating">1200</span>
                        </div>
                        <div class="mini-stat">
                            <span class="label">Solved</span>
                            <span class="val" id="puzzles-solved">0</span>
                        </div>
                        <div class="mini-stat">
                            <span class="label">Streak</span>
                            <span class="val" id="current-streak">0</span>
                        </div>
                        <div class="mini-stat">
                            <span class="label">Success</span>
                            <span class="val" id="success-rate">0%</span>
                        </div>
                    </div>

                    <div class="move-history-wrapper">
                        <div id="moves-container" class="moves-list">
                            <div style="text-align: center; padding-top: 2rem; opacity: 0.5; font-style: italic;">
                                Make a move...
                            </div>
                        </div>
                    </div>

                    <div class="dash-controls">
                        <button id="hint-btn" class="control-btn btn-hint" title="Hint">
                            <i class="fa-regular fa-lightbulb"></i> Hint
                        </button>
                        <button id="solution-btn" class="control-btn btn-solution" title="Solution">
                            <i class="fa-regular fa-eye"></i> Solution
                        </button>
                        <button id="new-puzzle-btn" class="control-btn btn-new" title="New Puzzle">
                            <i class="fa-solid fa-rotate"></i> New
                        </button>
                    </div>

                    <div class="dash-settings">
                        <label><i class="fa-solid fa-sliders"></i> Level:</label>
                        <select id="difficulty-filter" class="custom-select">
                            <option value="">Auto (Adaptive)</option>
                            <option value="beginner">Beginner</option>
                            <option value="intermediate">Intermediate</option>
                            <option value="advanced">Advanced</option>
                            <option value="expert">Expert</option>
                        </select>
                        <select id="theme-filter" class="custom-select" style="display:none"></select>
                    </div>

                </div>
            </div>

        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="./js/auth-check.js"></script>
    <script src="./js/navbar.js"></script>
    <script src="./js/puzzle-renderer.js"></script>
    <script src="./js/puzzles.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Reload trang khi bấm New Puzzle hoặc Next Puzzle
            // Đây là giải pháp an toàn nhất để reset bàn cờ mà không cần can thiệp sâu vào file puzzles.js
            const reloadGame = () => window.location.reload();
            
            const nextBtn = document.getElementById('btn-next-action');
            if(nextBtn) nextBtn.onclick = reloadGame;

            const newBtn = document.getElementById('new-puzzle-btn');
            if(newBtn) newBtn.onclick = reloadGame;
        });
    </script>
</body>
</html>
