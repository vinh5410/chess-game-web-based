<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CHESSMATE - Home</title>
    <link rel="stylesheet" href="./styles/navbar.css">
    <link rel="stylesheet" href="./styles/index.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="navbar-container">
            <a href="/" class="navbar-brand">
                <span>♔</span> CHESSMATE
            </a>
            
            <ul class="navbar-menu">
                <li><a href="/">Home</a></li>
                <li><a href="/play-vs-bot.html">Play vs Bot</a></li>
                <li><a href="/play-multiplayer.html">Multiplayer</a></li>
                <li><a href="/leaderboard.html">Leaderboard</a></li>
            </ul>
            
            <div class="navbar-actions">
                <!-- Show when NOT logged in -->
                <div id="auth-buttons">
                    <a href="/login.html" class="btn btn-secondary">Login</a>
                    <a href="/register.html" class="btn btn-primary">Register</a>
                </div>
                
                <!-- Show when logged in -->
                <div id="user-menu">
                    <div class="dropdown">
                        <div class="user-info">
                            <img id="user-avatar" src="https://ui-avatars.com/api/?name=User" alt="Avatar" class="user-avatar">
                            <span id="username-display" class="username">User</span>
                        </div>
                        <div class="dropdown-menu">
                            <a href="/profile.html" class="dropdown-item">👤 My Profile</a>
                            <a href="/edit-profile.html" class="dropdown-item">⚙️ Edit Profile</a>
                            <div class="dropdown-divider"></div>
                            <a href="#" id="logout-btn" class="dropdown-item">🚪 Logout</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <section id="team">
        <h1>Welcome to CHESSMATE</h1>
        <div class="card-container">
            <div class="card">
                <h3>Play vs Bot</h3>
                <p>Test your skills against AI</p>
                <a href="/play-vs-bot.html" class="btn btn-primary">Play Now</a>
            </div>
            <div class="card">
                <h3>Multiplayer</h3>
                <p>Challenge players online</p>
                <a href="/play-multiplayer.html" class="btn btn-primary">Find Match</a>
            </div>
            <div class="card">
                <h3>Leaderboard</h3>
                <p>See top players</p>
                <a href="/leaderboard.html" class="btn btn-primary">View Rankings</a>
            </div>
        </div>
    </section>
    
    <script src="./js/auth-check.js"></script>
    <script src="./js/navbar.js"></script>
</body>
</html>
