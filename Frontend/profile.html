<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - CHESSMATE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="./styles/navbar.css">
    <link rel="stylesheet" href="./styles/index.css">
    <link rel="stylesheet" href="./styles/profile.css">
</head>
<body>
    <div class="bg-gradient"></div>
    <div class="bg-blur"></div>

    <nav class="navbar">
        <div class="navbar-container">
            <a href="/" class="navbar-brand">
                <i class="fa-solid fa-chess-king"></i> CHESSMATE
            </a>
            
            <ul class="navbar-menu">
                <li><a href="/play-multiplayer.html"><i class="fa-solid fa-users"></i> Multiplayer</a></li>
                <li><a href="/play-vs-bot.html"><i class="fa-solid fa-robot"></i> VS Bot</a></li>
                <li><a href="/puzzles.html"><i class="fa-solid fa-puzzle-piece"></i> Puzzles</a></li>
                <li><a href="/leaderboard.html"><i class="fa-solid fa-trophy"></i> Rankings</a></li>
            </ul>
            
            <div class="navbar-actions">
                <div id="auth-buttons">
                    <a href="/login.html" class="btn btn-secondary">Log In</a>
                    <a href="/register.html" class="btn btn-primary">Sign Up</a>
                </div>
                
                <div id="user-menu">
                    <div class="dropdown">
                        <div class="user-info">
                            <img id="user-avatar" src="https://ui-avatars.com/api/?name=User" alt="Avatar" class="user-avatar">
                            <span id="username-display" class="username">User</span>
                            <i class="fa-solid fa-chevron-down"></i>
                        </div>
                        <div class="dropdown-menu">
                            <a href="/profile.html" class="dropdown-item"><i class="fa-regular fa-user"></i> My Profile</a>
                            <a href="/edit-profile.html" class="dropdown-item"><i class="fa-solid fa-gear"></i> Settings</a>
                            <div class="dropdown-divider"></div>
                            <a href="#" id="logout-btn" class="dropdown-item text-danger"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Profile Content -->
    <div class="profile-container">
        <div class="profile-header">
            <img id="profile-avatar" src="" alt="Avatar" class="profile-avatar">
            <div class="profile-info">
                <h1 id="profile-username" class="profile-username">Loading...</h1>
                <p id="profile-email" class="profile-email">Loading...</p>
                <div class="profile-meta">
                    <span id="profile-rating" class="rating">⭐ 1200</span>
                    <span class="status" id="profile-status">🟢 Online</span>
                    <span id="profile-joined">📅 Joined: Loading...</span>
                </div>
            </div>
            <a href="/edit-profile.html" class="btn btn-primary">Edit Profile</a>
        </div>

        <div class="stats-container">
            <div class="stat-card">
                <div class="stat-icon">🎮</div>
                <div class="stat-value" id="stat-games">0</div>
                <div class="stat-label">Games Played</div>
            </div>
            
            <div class="stat-card">
                <div class="stat-icon">🏆</div>
                <div class="stat-value" id="stat-won">0</div>
                <div class="stat-label">Wins</div>
            </div>
            
            <div class="stat-card">
                <div class="stat-icon">❌</div>
                <div class="stat-value" id="stat-lost">0</div>
                <div class="stat-label">Losses</div>
            </div>
            
            <div class="stat-card">
                <div class="stat-icon">🤝</div>
                <div class="stat-value" id="stat-draw">0</div>
                <div class="stat-label">Draws</div>
            </div>
            
            <div class="stat-card">
                <div class="stat-icon">📊</div>
                <div class="stat-value" id="stat-winrate">0%</div>
                <div class="stat-label">Win Rate</div>
            </div>
        </div>
    </div>

    <script src="./js/auth-check.js"></script>
    <script src="./js/navbar.js"></script>
    <script src="./js/profile.js"></script>
</body>
</html>
