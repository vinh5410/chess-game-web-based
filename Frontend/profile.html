<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player Profile - CHESSMATE</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="./styles/navbar.css">
    <link rel="stylesheet" href="./styles/profile.css"> <link rel="shortcut icon" type="image/x-icon" href="./assets/favicon.ico">
</head>
<body>
    
    <div class="bg-gradient"></div>
    <div class="bg-blur"></div>

    <nav class="navbar">
        <div class="navbar-container">
            <a href="/" class="navbar-brand">
                <i class="fa-solid fa-chess-king"></i> CHESSMATE
            </a>
            
            <ul class="navbar-menu">
                <li><a href="/play-multiplayer.html"><i class="fa-solid fa-users"></i> Multiplayer</a></li>
                <li><a href="/play-vs-bot.html"><i class="fa-solid fa-robot"></i> VS Bot</a></li>
                <li><a href="/puzzles.html"><i class="fa-solid fa-puzzle-piece"></i> Puzzles</a></li>
                <li><a href="/leaderboard.html"><i class="fa-solid fa-trophy"></i> Leaderboard</a></li>
            </ul>
            
            <div class="navbar-actions">
                <div id="auth-buttons">
                    <a href="/login.html" class="btn btn-secondary">Log In</a>
                    <a href="/register.html" class="btn btn-primary">Sign Up</a>
                </div>
                
                <div id="user-menu">
                    <div class="dropdown">
                        <div class="user-info">
                            <img id="user-avatar" src="https://ui-avatars.com/api/?name=User" alt="Avatar" class="user-avatar">
                            <span id="username-display" class="username">User</span>
                            <i class="fa-solid fa-chevron-down"></i>
                        </div>
                        <div class="dropdown-menu">
                            <a href="/profile.html" class="dropdown-item"><i class="fa-regular fa-user"></i> My Profile</a>
                            <a href="/history.html" class="dropdown-item"><i class="fa-solid fa-history"></i> History</a>
                            <a href="/edit-profile.html" class="dropdown-item"><i class="fa-solid fa-gear"></i> Settings</a>
                            <div class="dropdown-divider"></div>
                            <a href="#" id="logout-btn" class="dropdown-item text-danger"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <div class="profile-page-wrapper">
        
        <div class="profile-card glass-panel">
            
            <div class="profile-header-section">
                <div class="avatar-wrapper">
                    <img id="profile-avatar" src="https://ui-avatars.com/api/?name=Loading" alt="Avatar" class="profile-avatar-img">
                    <div class="rank-badge"><i class="fa-solid fa-chess-knight"></i></div>
                </div>
                
                <div class="info-wrapper">
                    <div class="name-row">
                        <h1 id="profile-username">Loading...</h1>
                        <span id="profile-status" class="status-badge"><i class="fa-solid fa-circle"></i> Online</span>
                    </div>
                    
                    <p id="profile-email"><i class="fa-solid fa-envelope"></i> loading...</p>
                    
                    <div class="meta-row">
                        <div class="meta-item">
                            <span class="meta-label">ELO Rating</span>
                            <span id="profile-rating" class="meta-value rating-text">1200</span>
                        </div>
                        <div class="meta-item">
                            <span class="meta-label">Member Since</span>
                            <span id="profile-joined" class="meta-value">...</span>
                        </div>
                    </div>

                    <a href="/edit-profile.html" class="btn-edit">
                        <i class="fa-solid fa-pen-to-square"></i> Edit Profile
                    </a>
                </div>
            </div>

            <div class="stats-section">
                <h2 class="section-title">Battle Statistics</h2>
                
                <div class="stats-grid">
                    <div class="stat-box">
                        <div class="stat-icon icon-games"><i class="fa-solid fa-gamepad"></i></div>
                        <div class="stat-content">
                            <span class="stat-number" id="stat-games">0</span>
                            <span class="stat-title">Total Games</span>
                        </div>
                    </div>
                    
                    <div class="stat-box">
                        <div class="stat-icon icon-won"><i class="fa-solid fa-trophy"></i></div>
                        <div class="stat-content">
                            <span class="stat-number text-won" id="stat-won">0</span>
                            <span class="stat-title">Victories</span>
                        </div>
                    </div>
                    
                    <div class="stat-box">
                        <div class="stat-icon icon-rate"><i class="fa-solid fa-chart-pie"></i></div>
                        <div class="stat-content">
                            <span class="stat-number text-rate" id="stat-winrate">0%</span>
                            <span class="stat-title">Win Rate</span>
                        </div>
                    </div>
                    
                    <div class="stat-box">
                        <div class="stat-icon icon-lost"><i class="fa-solid fa-skull"></i></div>
                        <div class="stat-content">
                            <span class="stat-number text-lost" id="stat-lost">0</span>
                            <span class="stat-title">Defeats</span>
                        </div>
                    </div>
                    
                    <div class="stat-box">
                        <div class="stat-icon icon-draw"><i class="fa-solid fa-handshake"></i></div>
                        <div class="stat-content">
                            <span class="stat-number text-draw" id="stat-draw">0</span>
                            <span class="stat-title">Draws</span>
                        </div>
                    </div>

                     <div class="stat-box">
                        <div class="stat-icon icon-tier"><i class="fa-solid fa-crown"></i></div>
                        <div class="stat-content">
                            <span class="stat-number text-tier">Rookie</span>
                            <span class="stat-title">Current Rank</span>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="./js/auth-check.js"></script>
    <script src="./js/navbar.js"></script>
    <script src="./js/profile.js"></script>
</body>
</html>
