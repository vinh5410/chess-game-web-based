<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Lobby - CHESSMATE</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="shortcut icon" type="image/x-icon" href="./assets/favicon.ico">
    
    <link rel='stylesheet' type='text/css' media='screen' href='./styles/navbar.css'>
    <link rel='stylesheet' type='text/css' media='screen' href='./styles/index.css'>
    <link rel='stylesheet' type='text/css' media='screen' href='./styles/lobby.css'>
</head>
<body>

    <div class="bg-gradient"></div>
    <div class="bg-blur"></div>

    <header class="navbar">
        <div class="navbar-container">
            <a href="/" class="navbar-brand">
                <i class="fa-solid fa-chess-king"></i> CHESSMATE
            </a>
            
            <ul class="navbar-menu">
                <li><a href="/play-multiplayer.html"><i class="fa-solid fa-users"></i> Multiplayer</a></li>
                <li><a href="/play-vs-bot.html"><i class="fa-solid fa-robot"></i> VS Bot</a></li>
                <li><a href="/puzzles.html"><i class="fa-solid fa-puzzle-piece"></i> Puzzles</a></li>
                <li><a href="/leaderboard.html"><i class="fa-solid fa-trophy"></i> Rankings</a></li>
            </ul>
            
            <div class="navbar-actions">
                <div id="auth-buttons">
                    <a href="/login.html" class="btn btn-secondary">Log In</a>
                    <a href="/register.html" class="btn btn-primary">Sign Up</a>
                </div>
                
                <div id="user-menu">
                    <div class="dropdown">
                        <div class="user-info">
                            <img id="user-avatar" src="https://ui-avatars.com/api/?name=User" alt="Avatar" class="user-avatar">
                            <span id="username-display" class="username">User</span>
                            <i class="fa-solid fa-chevron-down"></i>
                        </div>
                        <div class="dropdown-menu">
                            <a href="/profile.html" class="dropdown-item"><i class="fa-regular fa-user"></i> My Profile</a>
                            <a href="/edit-profile.html" class="dropdown-item"><i class="fa-solid fa-gear"></i> Settings</a>
                            <div class="dropdown-divider"></div>
                            <a href="#" id="logout-btn" class="dropdown-item text-danger"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main id="room__lobby__container">
        
        <div id="form__container">
             <div id="form__container__header">
                 <div class="header-icon">
                    <i class="fa-solid fa-shield-halved"></i>
                 </div>
                 <p>Join the Battlefield</p>
                 <span class="sub-text">Create a new room or enter an existing ID</span>
            src="./js/auth-check.js"></script>
    <script src="./js/navbar.js"></script>
    <script  </div>
 
            <form id="lobby__form">
 
                 <div class="form__field__wrapper">
                     <label><i class="fa-solid fa-user-tag"></i> Your Name</label>
                     <input type="text" name="name" required placeholder="Display Name..." autocomplete="off"/>
                 </div>
 
                 <div class="form__field__wrapper">
                     <label><i class="fa-solid fa-dungeon"></i> Room Name</label>
                     <input type="text" name="room" required placeholder="Room Name..." autocomplete="off"/>
                 </div>
 
                 <div class="form__field__wrapper">
                     <button type="submit" class="btn-lobby">
                        Enter Room <i class="fa-solid fa-chess-board"></i>
                    </button>
                 </div>
            </form>
        </div>
     </main>
    
    <script src="//cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="text/javascript" src="/scripts/lobby.js"></script>
</body>
</html>
