<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rankings - CHESSMATE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="./styles/index.css">
    <link rel="stylesheet" href="./styles/navbar.css">
    <link rel="shortcut icon" type="image/x-icon" href="./assets/favicon.ico">
    <style>
        :root {
            --primary: #d4af37;
            --primary-hover: #f1c40f;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --glass-bg: rgba(30, 41, 59, 0.75);
        }
        
        body {
            overflow: auto;
            height: auto;
            min-height: 100vh;
        }
        
        .leaderboard-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }
        
        .page-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .page-header h1 {
            font-family: 'Inter', sans-serif;
            font-size: 2.5rem;
            color: var(--primary);
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
            margin-bottom: 0.5rem;
        }
        
        .page-header p {
            color: var(--text-muted);
            font-size: 1rem;
        }
        
        /* Tabs */
        .tabs {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 2rem;
        }
        
        .tab-btn {
            padding: 0.75rem 1.5rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: var(--text-muted);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .tab-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-main);
        }
        
        .tab-btn.active {
            background: var(--primary);
            color: #0f172a;
            border-color: var(--primary);
        }
        
        /* Leaderboard Card */
        .leaderboard-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        
        .leaderboard-header {
            display: grid;
            grid-template-columns: 50px 1fr 90px 70px;
            padding: 0.8rem 1rem;
            background: rgba(0, 0, 0, 0.3);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .leaderboard-row {
            display: grid;
            grid-template-columns: 50px 1fr 90px 70px;
            padding: 0.8rem 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            align-items: center;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .leaderboard-row:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateX(4px);
        }
        
        .leaderboard-row:last-child {
            border-bottom: none;
        }
        
        /* Top 3 special styles */
        .leaderboard-row.rank-1 .rank-badge {
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            color: #0f172a;
        }
        
        .leaderboard-row.rank-2 .rank-badge {
            background: linear-gradient(135deg, #c0c0c0, #a0a0a0);
            color: #0f172a;
        }
        
        .leaderboard-row.rank-3 .rank-badge {
            background: linear-gradient(135deg, #cd7f32, #a05a2c);
            color: #fff;
        }
        
        .rank-badge {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.8rem;
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-main);
        }
        
        .player-info {
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }
        
        .player-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 2px solid var(--primary);
            object-fit: cover;
        }
        
        .player-details {
            display: flex;
            flex-direction: column;
        }
        
        .player-name {
            font-weight: 600;
            color: var(--text-main);
            font-size: 0.9rem;
        }
        
        .player-title {
            font-size: 0.7rem;
            color: var(--primary);
        }
        
        .player-rating {
            font-family: 'Roboto Mono', monospace;
            font-size: 1rem;
            font-weight: 700;
            color: var(--primary);
            text-align: center;
        }
        
        .player-games {
            color: var(--text-muted);
            font-size: 0.85rem;
            text-align: center;
        }
        
        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-muted);
        }
        
        .empty-state i {
            font-size: 4rem;
            color: var(--primary);
            margin-bottom: 1rem;
            opacity: 0.5;
        }
        
        .empty-state h3 {
            color: var(--text-main);
            margin-bottom: 0.5rem;
        }
        
        /* Loading */
        .loading {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-muted);
        }
        
        .loading i {
            font-size: 2rem;
            color: var(--primary);
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        /* Pagination */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
            padding: 1rem;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }
        
        .page-btn {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: var(--text-muted);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .page-btn:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-main);
        }
        
        .page-btn.active {
            background: var(--primary);
            color: #0f172a;
            border-color: var(--primary);
        }
        
        .page-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        
        .page-info {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin: 0 0.5rem;
        }
        
        .page-input {
            width: 50px;
            padding: 0.4rem 0.5rem;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            color: var(--text-main);
            font-size: 0.9rem;
            text-align: center;
            font-weight: 600;
        }
        
        .page-input:focus {
            outline: none;
            border-color: var(--primary);
        }
        
        .page-input::-webkit-outer-spin-button,
        .page-input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        
        /* Player History Modal */
        .player-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        
        .player-modal.active {
            display: flex;
        }
        
        .player-modal-container {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            width: 100%;
            max-width: 700px;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .player-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .player-modal-header h3 {
            font-family: 'Inter', sans-serif;
            color: var(--primary);
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        
        .player-modal-header h3 img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid var(--primary);
        }
        
        .close-modal {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
            transition: color 0.3s;
        }
        
        .close-modal:hover {
            color: var(--primary);
        }
        
        .player-modal-body {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            scrollbar-width: thin;
            scrollbar-color: rgba(212, 175, 55, 0.5) transparent;
        }
        
        .player-modal-body::-webkit-scrollbar {
            width: 6px;
        }
        
        .player-modal-body::-webkit-scrollbar-track {
            background: transparent;
        }
        
        .player-modal-body::-webkit-scrollbar-thumb {
            background: rgba(212, 175, 55, 0.4);
            border-radius: 3px;
        }
        
        .player-modal-body::-webkit-scrollbar-thumb:hover {
            background: rgba(212, 175, 55, 0.6);
        }
        
        /* History List in Modal */
        .history-list {
            display: flex;
            flex-direction: column;
        }
        
        .history-item {
            padding: 1rem;
            display: grid;
            grid-template-columns: 1fr auto auto;
            align-items: center;
            gap: 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .history-item:last-child {
            border-bottom: none;
        }
        
        .history-item:hover {
            background: rgba(255, 255, 255, 0.05);
        }
        
        .history-players {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            flex-wrap: wrap;
        }
        
        .history-players .player {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .history-players .player-name {
            font-weight: 600;
            color: var(--text-main);
            font-size: 0.95rem;
        }
        
        .history-players .p-rating {
            font-size: 0.8rem;
            color: var(--text-muted);
        }
        
        .history-players .rating-change {
            font-size: 0.75rem;
            font-weight: 600;
        }
        
        .history-players .rating-change.positive {
            color: #4ade80;
        }
        
        .history-players .rating-change.negative {
            color: #f87171;
        }
        
        .history-players .vs {
            color: var(--text-muted);
            font-size: 0.85rem;
        }
        
        .history-result {
            padding: 0.35rem 0.75rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
        }
        
        .history-result.win {
            background: rgba(74, 222, 128, 0.15);
            color: #4ade80;
        }
        
        .history-result.loss {
            background: rgba(248, 113, 113, 0.15);
            color: #f87171;
        }
        
        .history-result.draw {
            background: rgba(148, 163, 184, 0.15);
            color: #94a3b8;
        }
        
        .history-date {
            font-size: 0.8rem;
            color: var(--text-muted);
            white-space: nowrap;
        }
        
        /* Replay Modal */
        .replay-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1001;
            align-items: center;
            justify-content: center;
        }
        
        .replay-modal.active {
            display: flex;
        }
        
        .replay-container {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 1.5rem;
            max-width: 95vw;
            max-height: 95vh;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        
        .replay-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .replay-header h3 {
            font-family: 'Inter', sans-serif;
            color: var(--primary);
            font-size: 1.2rem;
        }
        
        .replay-board {
            width: 400px;
            height: 400px;
            margin: 0 auto;
        }
        
        .replay-board canvas {
            width: 100%;
            height: 100%;
            border-radius: 8px;
        }
        
        .replay-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1rem;
        }
        
        .replay-controls button {
            padding: 0.6rem 1rem;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .replay-controls button:hover:not(:disabled) {
            background: var(--primary);
            color: #0f172a;
            border-color: var(--primary);
        }
        
        .replay-controls button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .move-info {
            min-width: 150px;
            text-align: center;
            color: var(--text-main);
            font-weight: 500;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .leaderboard-header,
            .leaderboard-row {
                grid-template-columns: 40px 1fr 70px 50px;
                padding: 0.6rem 0.5rem;
            }
            
            .leaderboard-header .games-col,
            .leaderboard-row .player-games {
                font-size: 0.75rem;
            }
            
            .rank-badge {
                width: 28px;
                height: 28px;
                font-size: 0.75rem;
            }
            
            .player-avatar {
                width: 32px;
                height: 32px;
            }
            
            .player-name {
                font-size: 0.85rem;
            }
            
            .player-title {
                font-size: 0.65rem;
            }
            
            .player-rating {
                font-size: 1rem;
            }
            
            .tabs {
                flex-wrap: wrap;
            }
            
            .tab-btn {
                padding: 0.6rem 1rem;
                font-size: 0.85rem;
            }
            
            .history-item {
                grid-template-columns: 1fr;
                gap: 0.5rem;
            }
            
            .replay-board {
                width: 300px;
                height: 300px;
            }

            .replay-controls {
                gap: 0.5rem;
                flex-wrap: wrap;
            }

            .replay-controls button {
                padding: 0.5rem 0.8rem;
                font-size: 0.9rem;
            }

            .move-info {
                min-width: 120px;
                font-size: 0.85rem;
            }

            .replay-container {
                padding: 1rem;
            }

            .replay-header h3 {
                font-size: 1rem;
            }
        }
    </style>
</head>

    <script>
        const API_URL = '';
        let currentType = 'pvp';
        let replayRenderer = null;
        let currentGameMoves = [];
        let currentMoveIndex = 0;
        let currentViewingPlayer = null;
        
        // Pagination
        const ITEMS_PER_PAGE = 10;
        let currentPage = 1;
        let allPlayers = [];
        
        // Tab switching
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentType = btn.dataset.type;
                loadLeaderboard();
            });
        });
        
        async function loadLeaderboard() {
            const body = document.getElementById('leaderboard-body');
            const pagination = document.getElementById('pagination');
            pagination.style.display = 'none';
            
            body.innerHTML = `
                <div class="loading">
                    <i class="fa-solid fa-spinner"></i>
                    <p>Loading rankings...</p>
                </div>
            `;
            
            try {
                const endpoint = currentType === 'pvp' 
                    ? '/api/users/leaderboard'
                    : '/api/puzzles/leaderboard';
                
                const response = await fetch(endpoint);
                const data = await response.json();
                
                if (data.success && data.leaderboard && data.leaderboard.length > 0) {
                    allPlayers = data.leaderboard;
                    currentPage = 1;
                    renderLeaderboardPage();
                } else {
                    body.innerHTML = `
                        <div class="empty-state">
                            <i class="fa-solid fa-trophy"></i>
                            <h3>No rankings yet</h3>
                            <p>Be the first to climb the leaderboard!</p>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Error loading leaderboard:', error);
                body.innerHTML = `
                    <div class="empty-state">
                        <i class="fa-solid fa-exclamation-triangle"></i>
                        <h3>Failed to load rankings</h3>
                        <p>Please try again later</p>
                    </div>
                `;
            }
        }
        
        // Store players data for click handler
        let currentPlayers = [];
        
        function renderLeaderboardPage() {
            const totalPages = Math.ceil(allPlayers.length / ITEMS_PER_PAGE);
            const startIndex = (currentPage - 1) * ITEMS_PER_PAGE;
            const endIndex = startIndex + ITEMS_PER_PAGE;
            const playersToShow = allPlayers.slice(startIndex, endIndex);
            
            renderLeaderboard(playersToShow, startIndex);
            renderPagination(totalPages);
        }
        
        function renderPagination(totalPages) {
            const pagination = document.getElementById('pagination');
            
            if (totalPages <= 1) {
                pagination.style.display = 'none';
                return;
            }
            
            pagination.style.display = 'flex';
            
            pagination.innerHTML = `
                <button class="page-btn" onclick="changePage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>
                    <i class="fa-solid fa-chevron-left"></i>
                </button>
                <span class="page-info">Page</span>
                <input type="number" class="page-input" id="page-input" value="${currentPage}" min="1" max="${totalPages}" onkeypress="if(event.key==='Enter')goToPage()">
                <span class="page-info">/ ${totalPages}</span>
                <button class="page-btn" onclick="goToPage()" title="Go">
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
                <button class="page-btn" onclick="changePage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>
                    <i class="fa-solid fa-chevron-right"></i>
                </button>
            `;
        }
        
        function goToPage() {
            const input = document.getElementById('page-input');
            const page = parseInt(input.value);
            const totalPages = Math.ceil(allPlayers.length / ITEMS_PER_PAGE);
            
            if (page >= 1 && page <= totalPages) {
                changePage(page);
            } else {
                input.value = currentPage;
            }
        }
        
        function changePage(page) {
            const totalPages = Math.ceil(allPlayers.length / ITEMS_PER_PAGE);
            if (page < 1 || page > totalPages) return;
            currentPage = page;
            renderLeaderboardPage();
        }
        
        function renderLeaderboard(players, startIndex = 0) {
            const body = document.getElementById('leaderboard-body');
            currentPlayers = players; // Store for click handler
            
            body.innerHTML = players.map((player, index) => {
                const rank = startIndex + index + 1;
                const rankClass = rank <= 3 ? `rank-${rank}` : '';
                const rating = currentType === 'pvp' ? player.rating : player.puzzleRating;
                const games = currentType === 'pvp' ? player.gamesPlayed : player.puzzlesSolved;
                const title = getTitle(rating);
                const playerId = player._id || player.id || player.odUserId;
                const avatar = player.avatar || `https://ui-avatars.com/api/?name=${encodeURIComponent(player.username)}&background=d4af37&color=0f172a`;
                
                // For puzzle, don't allow clicking to view history (no puzzle history yet)
                const clickable = currentType === 'pvp';
                const cursorStyle = clickable ? '' : 'style="cursor: default;"';
                
                return `
                    <div class="leaderboard-row ${rankClass}" 
                         data-player-id="${playerId}" 
                         data-clickable="${clickable}"
                         ${cursorStyle}>
                        <div class="rank-badge">${rank}</div>
                        <div class="player-info">
                            <img src="${avatar}" alt="${player.username}" class="player-avatar">
                            <div class="player-details">
                                <span class="player-name">${player.username}</span>
                                <span class="player-title">${title}</span>
                            </div>
                        </div>
                        <div class="player-rating">${rating || 1200}</div>
                        <div class="player-games">${games || 0}</div>
                    </div>
                `;
            }).join('');
        }
        
        // Event delegation for clicking on rows
        document.getElementById('leaderboard-body').addEventListener('click', function(e) {
            const row = e.target.closest('.leaderboard-row');
            if (!row) return;
            
            const clickable = row.dataset.clickable === 'true';
            if (!clickable) return;
            
            const playerId = row.dataset.playerId;
            const username = row.querySelector('.player-name').textContent;
            const avatarImg = row.querySelector('.player-avatar');
            const avatar = avatarImg ? avatarImg.src : '';
            
            viewPlayerHistory(playerId, username, avatar);
        });
        
        function getTitle(rating) {
            if (rating >= 2400) return 'Grandmaster';
            if (rating >= 2200) return 'Master';
            if (rating >= 2000) return 'Expert';
            if (rating >= 1800) return 'Class A';
            if (rating >= 1600) return 'Class B';
            if (rating >= 1400) return 'Class C';
            if (rating >= 1200) return 'Class D';
            return 'Beginner';
        }
        
        // View player history
        async function viewPlayerHistory(playerId, username, avatar) {
            currentViewingPlayer = { id: playerId, username, avatar };
            
            const modal = document.getElementById('player-modal');
            modal.classList.add('active');
            
            document.getElementById('modal-player-avatar').src = avatar;
            document.getElementById('modal-player-name').textContent = `${username}'s Match History`;
            
            const body = document.getElementById('player-history-body');
            body.innerHTML = `
                <div class="loading">
                    <i class="fa-solid fa-spinner"></i>
                    <p>Loading history...</p>
                </div>
            `;
            
            try {
                const response = await fetch(`/api/history/user/${playerId}`);
                const data = await response.json();
                
                if (data.success && data.games && data.games.length > 0) {
                    renderPlayerHistory(data.games, username);
                } else {
                    body.innerHTML = `
                        <div class="empty-state">
                            <i class="fa-solid fa-chess-board"></i>
                            <h3>No games yet</h3>
                            <p>This player hasn't played any games yet</p>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Error loading player history:', error);
                body.innerHTML = `
                    <div class="empty-state">
                        <i class="fa-solid fa-exclamation-triangle"></i>
                        <h3>Failed to load history</h3>
                        <p>Please try again later</p>
                    </div>
                `;
            }
        }
        
        function renderPlayerHistory(games, playerUsername) {
            const body = document.getElementById('player-history-body');
            
            body.innerHTML = `<div class="history-list">${games.map(game => {
                const isWhite = game.whitePlayer.username === playerUsername;
                const opponent = isWhite ? game.blackPlayer : game.whitePlayer;
                const thisPlayer = isWhite ? game.whitePlayer : game.blackPlayer;
                
                // Handle different result formats
                let result = 'draw';
                let resultText = 'DRAW';
                const gameResult = game.result || '';
                
                if (gameResult === '1-0' || gameResult === 'white-win') {
                    result = isWhite ? 'win' : 'loss';
                    resultText = isWhite ? 'WIN' : 'LOSS';
                } else if (gameResult === '0-1' || gameResult === 'black-win') {
                    result = isWhite ? 'loss' : 'win';
                    resultText = isWhite ? 'LOSS' : 'WIN';
                }
                
                const ratingChange = thisPlayer.ratingChange || 0;
                const ratingChangeClass = ratingChange >= 0 ? 'positive' : 'negative';
                const ratingChangeText = ratingChange >= 0 ? `+${ratingChange}` : ratingChange;
                
                // Handle different date fields
                const gameDate = game.endedAt || game.startedAt || game.createdAt;
                const date = gameDate ? new Date(gameDate).toLocaleDateString('en-US', {
                    month: 'short',
                    day: 'numeric',
                    year: 'numeric'
                }) : 'N/A';
                
                return `
                    <div class="history-item" onclick="viewGameReplay('${game._id}')">
                        <div class="history-players">
                            <div class="player">
                                <span class="player-name">${playerUsername}</span>
                                <span class="p-rating">(${thisPlayer.rating || 1200})</span>
                                <span class="rating-change ${ratingChangeClass}">${ratingChangeText}</span>
                            </div>
                            <span class="vs">vs</span>
                            <div class="player">
                                <span class="player-name">${opponent.username}</span>
                                <span class="p-rating">(${opponent.rating || 1200})</span>
                            </div>
                        </div>
                        <span class="history-result ${result}">${resultText}</span>
                        <span class="history-date">${date}</span>
                    </div>
                `;
            }).join('')}</div>`;
        }
        
        // Close player modal
        document.getElementById('close-player-modal').addEventListener('click', () => {
            document.getElementById('player-modal').classList.remove('active');
        });
        
        document.getElementById('player-modal').addEventListener('click', (e) => {
            if (e.target.id === 'player-modal') {
                document.getElementById('player-modal').classList.remove('active');
            }
        });
        
        // Game Replay Functions
        async function viewGameReplay(gameId) {
            try {
                const response = await fetch(`/api/history/game/${gameId}`);
                const data = await response.json();
                
                if (data.success && data.game) {
                    openReplayModal(data.game);
                } else {
                    alert('Failed to load game');
                }
            } catch (error) {
                console.error('Error loading game:', error);
                alert('Error loading game replay');
            }
        }
        
        async function openReplayModal(game) {
            const modal = document.getElementById('replay-modal');
            modal.classList.add('active');
            
            // Wait a tick for modal to become visible
            await new Promise(resolve => setTimeout(resolve, 50));
            
            // Initialize renderer if needed
            if (!replayRenderer) {
                try {
                    replayRenderer = new ChessBoardRenderer('replay-canvas', { fixedSize: 400 });
                    await replayRenderer.loadPieceImages();
                    console.log('✅ Replay renderer initialized');
                } catch (error) {
                    console.error('Failed to initialize replay renderer:', error);
                    return;
                }
            }
            
            // Flatten moves
            currentGameMoves = [];
            if (game.moves && game.moves.length > 0) {
                for (const movePair of game.moves) {
                    if (movePair.white && movePair.white.san) currentGameMoves.push(movePair.white);
                    if (movePair.black && movePair.black.san) currentGameMoves.push(movePair.black);
                }
            }
            currentMoveIndex = 0;
            
            showReplayMove(0);
        }
        
        function showReplayMove(index) {
            if (!replayRenderer) return;
            
            currentMoveIndex = Math.max(0, Math.min(index, currentGameMoves.length));
            
            // Reset and replay moves
            replayRenderer.game.reset();
            replayRenderer.clearSelection();
            
            for (let i = 0; i < currentMoveIndex; i++) {
                const move = currentGameMoves[i];
                if (move && move.from && move.to) {
                    try {
                        replayRenderer.game.move({ from: move.from, to: move.to, promotion: move.promotion });
                    } catch (e) {
                        console.warn('Invalid move in replay:', move, e);
                    }
                }
            }
            replayRenderer.draw();
            
            const moveInfo = document.getElementById('move-info');
            moveInfo.textContent = currentMoveIndex === 0 
                ? 'Starting Position' 
                : `Move ${currentMoveIndex} / ${currentGameMoves.length}`;
            
            // Update button states
            document.getElementById('first-move').disabled = currentMoveIndex === 0;
            document.getElementById('prev-move').disabled = currentMoveIndex === 0;
            document.getElementById('next-move').disabled = currentMoveIndex === currentGameMoves.length;
            document.getElementById('last-move').disabled = currentMoveIndex === currentGameMoves.length;
        }
        
        // Replay controls
        document.getElementById('first-move').addEventListener('click', () => showReplayMove(0));
        document.getElementById('prev-move').addEventListener('click', () => showReplayMove(currentMoveIndex - 1));
        document.getElementById('next-move').addEventListener('click', () => showReplayMove(currentMoveIndex + 1));
        document.getElementById('last-move').addEventListener('click', () => showReplayMove(currentGameMoves.length));
        
        document.getElementById('close-replay').addEventListener('click', () => {
            document.getElementById('replay-modal').classList.remove('active');
        });
        
        // Close replay modal on outside click
        document.getElementById('replay-modal').addEventListener('click', (e) => {
            if (e.target.id === 'replay-modal') {
                document.getElementById('replay-modal').classList.remove('active');
            }
        });
        
        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            const replayModal = document.getElementById('replay-modal');
            const playerModal = document.getElementById('player-modal');
            
            if (replayModal.classList.contains('active')) {
                if (e.key === 'ArrowLeft') showReplayMove(currentMoveIndex - 1);
                if (e.key === 'ArrowRight') showReplayMove(currentMoveIndex + 1);
                if (e.key === 'Home') showReplayMove(0);
                if (e.key === 'End') showReplayMove(currentGameMoves.length);
                if (e.key === 'Escape') replayModal.classList.remove('active');
            } else if (playerModal.classList.contains('active')) {
                if (e.key === 'Escape') playerModal.classList.remove('active');
            }
        });
        
        // Load on page load
        loadLeaderboard();
    </script>
</body>
</html>
