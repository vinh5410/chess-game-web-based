<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - CHESSMATE</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="./styles/login.css">
    <link rel="shortcut icon" type="image/x-icon" href="./assets/favicon.ico">
</head>
<body>
    
    <div class="bg-gradient"></div>
    <div class="bg-blur"></div>

    <main class="split-container">
        
        <section class="brand-panel">
            <a href="index.html" class="brand-content">
                <div class="huge-logo">
                    <i class="fa-solid fa-chess-king"></i>
                </div>
                <h1>CHESSMATE</h1>
                <p class="tagline">Join the Ranks. Claim your Throne.</p>
            </a>
            <div class="brand-background-graphic">
                <i class="fa-solid fa-chess-bishop"></i>
            </div>
        </section>

        <section class="form-panel">
            <div class="auth-card">

                <div class="auth-header">
                    <div class="mobile-logo" onclick="window.location.href='index.html'">
                         <i class="fa-solid fa-chess-king"></i> CHESSMATE
                    </div>
                    <h2>Create Account</h2>
                    <p>Begin your journey to Grandmaster</p>
                </div>
                
                <form id="registerForm">
                    <div class="form-group">
                        <label for="username"><i class="fa-solid fa-user"></i> Username</label>
                        <input type="text" id="username" name="username" required 
                               minlength="3" maxlength="20" placeholder="Choose a username" autocomplete="off">
                    </div>
                    
                    <div class="form-group">
                        <label for="email"><i class="fa-solid fa-envelope"></i> Email</label>
                        <input type="email" id="email" name="email" required 
                               placeholder="name@example.com" autocomplete="off">
                    </div>
                    
                    <div class="form-group">
                        <label for="password"><i class="fa-solid fa-lock"></i> Password</label>
                        <input type="password" id="password" name="password" required 
                               minlength="6" placeholder="At least 6 characters">
                    </div>
                    
                    <div class="form-group">
                        <label for="confirmPassword"><i class="fa-solid fa-shield-halved"></i> Confirm Password</label>
                        <input type="password" id="confirmPassword" name="confirmPassword" required 
                               placeholder="Re-enter your password">
                    </div>
                    
                    <button type="submit" class="btn-submit">
                        Register <i class="fa-solid fa-user-plus"></i>
                    </button>
                </form>
                
                <div id="message" class="message"></div>
                
                <div class="auth-links">
                    Already have an account? <a href="login.html">Log In here</a>
                </div>
            </div>
        </section>
    </main>
    
    <script src="./js/auth-check.js"></script>
    
    <script src="./js/register.js"></script>
</body>
</html>
