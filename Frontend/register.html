<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - CHESSMATE</title>
    <link rel="stylesheet" href="./styles/auth.css">
    <link rel="shortcut icon" type="image/x-icon" href="./assets/favicon.ico">
</head>
<body>
    <div class="auth-container">
        <div class="logo" style="cursor: pointer;" onclick="window.location.href='index.html'">
            <h1>♔ CHESSMATE</h1>
        </div>
        <h2>Create Account</h2>
        
        <form id="registerForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required 
                       minlength="3" maxlength="20" placeholder="Enter username">
            </div>
            
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required 
                       placeholder="Enter email">
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required 
                       minlength="6" placeholder="Enter password (min 6 characters)">
            </div>
            
            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" required 
                       placeholder="Confirm password">
            </div>
            
            <button type="submit" class="btn-submit">Register</button>
        </form>
        
        <div id="message" class="message"></div>
        
        <div class="auth-links">
            Already have an account? <a href="login.html">Login here</a>
        </div>
    </div>
    
    <!-- ADD AUTH CHECK -->
    <script src="./js/auth-check.js"></script>
    <script src="./js/register.js"></script>
</body>
</html>
